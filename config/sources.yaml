    notes: >-
      life.kaya.ac.kr·www.kaya.ac.kr 모두 GitHub 러너에서 연결 끊김/시간초과(2026-09-22, 2회) → 지자체와 같은 러너 IP 차단으로 판단. 국내 IP 필요.

  - id: gimhae_college_lifelong
    name: 김해대학교 평생직업교육원
    org_type: university
    tier: 3
