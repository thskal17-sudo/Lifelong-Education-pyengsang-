    notes: >-
      soc.inje.ac.kr 은 GitHub 러너에서 http/https 모두 403 Forbidden(2026-09-22, 2회). 국내 IP 또는 로컬 probe 로 재확인 필요. 대신 본교 모집/채용공지(inje_recruit)로 대체.

  - id: kaya_lifelong
