# 수집원 레지스트리 — 부산·울산·경남 대학 평생교육원
#
# 이 저장소는 대학 부설 평생교육원(평생학습원·미래교육원 등)의 강사 모집 공고만 수집한다.
# 지자체·교육청·출자출연기관·채용포털은 대상이 아니다
# (그쪽은 thskal17-sudo/Gyeongnam-Instructor-Announcement 에서 다룬다).
#
# - 스키마: docs/DESIGN.md 13.1
# - verified: 러너에서 목록·상세 구조를 실제로 확인했으면 true
# - enabled: false 인 항목은 사유를 notes 에 적는다 (robots 차단, 셀렉터 미확정, 러너 IP 차단 등)
# - 셀렉터는 probe·구조 덤프(.github/workflows/probe.yml)로 확인하며 채운다

defaults:
  enabled: true
  verified: false
  tos_checked: false
  schedule: daily
  region_hint: []
  adapter:
    paging: { max_pages: 2 }

sources:
# ---------------------------------------------------------------------------
# 경남 — 검증 완료·설정된 대학 평생교육원
# ---------------------------------------------------------------------------
  - id: cwnu_lifelong
    name: 창원대학교 평생교육원 공지사항
    org_type: university
    tier: 3
    homepage: https://www.changwon.ac.kr/lifelong/main.do
    region_hint: [경남, 창원]
    verified: true
    adapter:
      type: html_list
      list_url: https://www.changwon.ac.kr/lifelong/na/ntt/selectNttList.do?mi=4774&bbsId=1787
      row_selector: table#nttTable tbody tr
      title_selector: td.bbs_tit a
      link_selector: td.bbs_tit a
      link_attr: data-id
      link_regex: '(\d+)'
      link_url_template: https://www.changwon.ac.kr/lifelong/na/ntt/selectNttInfo.do?mi=4774&bbsId=1787&nttSn={1}
      date_selector: td:nth-child(4)
      keywords: [강사, 교강사, 강좌 개설, 개설 신청, 개설강좌, 지도사, 지도자]
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: div.ntt_cn }
    notes: >-
      공지사항 게시판(2026-09-22 러너에서 gia probe 로 검증: 목록 3건·본문 972자·마감 추출 정상). 링크는 a.nttInfoBtn 의 data-id(nttSn) 로 상세 URL 조립. 강사 자료실(bbsId=1786)은 재직 강사용 안내라 제외.
      날짜 형식 '2026. 6. 25'.

  - id: cwnu_lifelong_jobs
    name: 창원대학교 평생교육원 구인구직
    org_type: university
    tier: 3
    homepage: https://www.changwon.ac.kr/lifelong/main.do
    region_hint: [경남, 창원]
    verified: true
    schedule: daily_light
    adapter:
      type: html_list
      list_url: https://www.changwon.ac.kr/lifelong/na/ntt/selectNttList.do?mi=4780&bbsId=1790
      row_selector: table#nttTable tbody tr
      title_selector: td.bbs_tit a
      link_selector: td.bbs_tit a
      link_attr: data-id
      link_regex: '(\d+)'
      link_url_template: https://www.changwon.ac.kr/lifelong/na/ntt/selectNttInfo.do?mi=4780&bbsId=1790&nttSn={1}
      date_selector: td:nth-child(4)
      keywords: [강사, 교강사, 지도사, 지도자, 교습]
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: div.ntt_cn }
    notes: >-
      학원 등 외부 구인 게시판(2026-09-22 러너 검증). 마지막 글이 2023년이라 빈도 매우 낮음. 게시자는 마스킹(평**)이라 org 는 기관명으로.

  - id: masan_lifelong
    name: 마산대학교 평생교육원 공지사항
    org_type: university
    tier: 3
    homepage: https://lifelong.masan.ac.kr/main
    region_hint: [경남, 창원]
    verified: true
    adapter:
      type: html_list
      list_url: https://lifelong.masan.ac.kr/board/000001
      row_selector: table#tablelist tbody tr
      title_selector: td.text-left a
      date_selector: td:nth-child(4)
      keywords: [강사, 교강사, 강좌 개설, 개설 신청, 개설 제안, 지도사, 지도자]
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: div.board-view }
    notes: >-
      공지사항(2026-09-22 러너에서 gia probe 검증: 목록 1건). 상세는 div.board-view-cont 로 2자만 잡혀 상위 div.board-view(제목 포함) 사용. 날짜 '2026.09.07 16:30'. /board/000001/2 도 1페이지와 같은 내용이라(페이징은 POST) 1페이지(10건)만.

  - id: masan_lectopen
    name: 마산대학교 평생교육원 강좌 개설 신청
    org_type: university
    tier: 3
    homepage: https://lifelong.masan.ac.kr/main
    region_hint: [경남, 창원]
    verified: true
    adapter:
      type: html_list
      list_url: https://lifelong.masan.ac.kr/lectopen
      row_selector: table#tablelist tbody tr
      title_selector: td.text-left a
      date_selector: td:nth-child(6)
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: div.board-view-cont }
    notes: >-
      강좌 개설 신청 공고(강사가 강좌를 제안하는 모집, 2026-09-22 러너에서 gia probe 검증: 목록 3건·본문 659자·마감 추출 정상). 모든 행이 강사 대상이므로 keywords 없음.
      6열 '신청기간'(2026.06.01 00:00 ~ 2026.06.30 00:00)의 첫 날짜가 게시일로 잡힘 → 실제 게시일보다 이르게 기록될 수 있음.

  - id: yonam_lifelong
    name: 연암공과대학교 평생교육원 (진주)
    org_type: university
    tier: 3
    homepage: https://lifelong.yc.ac.kr
    region_hint: [경남, 진주]
    verified: true
    schedule: daily_light
    adapter:
      type: html_list
      list_url: https://lifelong.yc.ac.kr/bbs/board.php?bo_table=sub5_1&page={page}
      row_selector: ul.fz-list > li
      title_selector: div.fz-subject a.list-subject
      keywords: [강사, 교강사, 강좌 개설, 개설 신청, 지도사, 지도자]
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: "div#bo_v_con", attachment_selector: a.view_file_download }
    notes: >-
      2026년 신설 사이트, 공지 1건(홈페이지 오픈)뿐이라 gia probe 수집 실적 0건(2026-09-22). 셀렉터는 구조 덤프 기준이며 목록에 날짜 없음 → 첫 강사 공고가 뜨면 재확인. 그누보드라 상세 본문은 진주보건대와 같은 구조로 가정.

  - id: jinju_health_lifelong
    name: 진주보건대학교 평생교육원
    org_type: university
    tier: 3
    homepage: https://lifelong.jhc.ac.kr
    region_hint: [경남, 진주]
    verified: true
    adapter:
      type: html_list
      list_url: https://lifelong.jhc.ac.kr/bbs/board.php?bo_table=sub4_1&page={page}
      row_selector: div.tbl_head01 table tbody tr
      title_selector: td.td_subject ul.bo_tit_ul2 a
      date_selector: ul.bo_tit_ul3
      keywords: [강사, 교강사, 강좌 개설, 개설 신청, 지도사, 지도자]
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: "div#bo_v_con", attachment_selector: a.view_file_download }
    notes: >-
      공지사항(그누보드, 2026-09-22 러너에서 gia probe 검증: 목록 1건·본문 842자·첨부 hwp 추출). 날짜 열(td_datetime)이 비어 있어 제목 아래 ul.bo_tit_ul3('지킴이 2026-08-05 102')에서 추출.
      매 학기 '강좌 개설 신청 공고'(강사 모집)가 올라오고 첨부(hwp)는 download.php 링크.

  - id: koje_lifelong
    name: 거제대학교 평생학습원 강사모집
    org_type: university
    tier: 3
    enabled: true
    verified: true
    schedule: daily_light
    homepage: https://anytime.koje.ac.kr/anytime
    region_hint: [경남, 거제]
    adapter:
      type: html_list
      tls_legacy: true   # 구형 TLS 서버 (#15) — 이 호스트만 구형 컨텍스트·검증 생략
      org_name: 거제대학교 평생학습원
      list_url: https://anytime.koje.ac.kr/anytime/board/6
      row_selector: table#tablelist tbody tr
      title_selector: td.text-left a
      date_selector: td:nth-child(4)
      date_formats: ["%Y.%m.%d %H:%M", "%Y.%m.%d"]
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: body }
    notes: >-
      '강사모집' 전용 게시판(board/6, 2026-09-22 러너 구조 검증: table#tablelist, 제목 td.text-left a → /anytime/boardview/6/{n}, 작성일 4열 '2020.03.25 17:17').
      마지막 글이 2020년이라 평소엔 0건이지만 전용 게시판이라 daily_light 로 유지. 구형 TLS 라 adapter.tls_legacy: true 필요(#15).
      상세 본문 셀렉터는 미확인이라 body 전체 사용.

  - id: gnu_lifelong
    name: 경상국립대학교 평생교육원
    org_type: university
    tier: 3
    homepage: https://longlife.gnu.ac.kr
    region_hint: [경남, 진주]
    verified: true
    enabled: false
    adapter:
      type: html_list
      list_url: https://longlife.gnu.ac.kr/board.jsp?sID=0401
      row_selector: table.base tbody tr
      title_selector: td.left a
      link_selector: td.left a
      link_attr: href
      link_regex: 'toPage\("(\d+)"\)'
      link_url_template: https://longlife.gnu.ac.kr/board.jsp?sID=0401&btype=view&bcode=notice&no={1}
      date_selector: td:nth-child(5)
      org_selector: td:nth-child(4)
      keywords: [강사, 교강사, 강좌 개설, 개설 신청, 지도사, 지도자]
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: "div#contentsBody" }
    notes: >-
      공지사항 게시판(2026-09-22 GitHub 러너에서 구조 검증). 그러나 robots.txt 가 'User-agent: * Disallow: /' 라 gia(respect_robots) 수집 불가 → 비활성.
      사이트 운영자 허락을 받거나 정책을 바꾸기 전까지 수동 확인 대상. 링크가 javascript:toPage("번호") 라 홈 화면의 상세 URL 형식으로 조립.
      매 학기 '[강사 공지] 강좌 개설 신청 안내'가 올라옴(강사가 강좌를 제안하는 방식). 페이징 파라미터 미확인이라 1페이지(10건)만.

  - id: kyungnam_lifelong
    name: 경남대학교 평생교육원 채용공고
    org_type: university
    tier: 3
    homepage: https://www.kyungnam.ac.kr/sites/cce/index.do
    region_hint: [경남, 창원]
    verified: true
    enabled: false
    adapter:
      type: html_list
      list_url: https://www.kyungnam.ac.kr/cce/14630/subview.do?page={page}
      row_selector: table.board-table tbody tr
      title_selector: td.td-subject a
      date_selector: td.td-date
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: div.artclView }
    notes: >-
      평생교육원 채용공고 게시판(2026-09-22 러너 구조 검증, k2web CMS). robots.txt 가 Googlebot·Bingbot·Yeti 외 전부 'Disallow: /' 라 gia 수집 불가 → 비활성. 게시글이 드묾(2026-05 1건). 상세 artclView.do 는 12KB 조각 페이지라 본문 셀렉터는 추정값.

  - id: kyungnam_lifelong_notice
    name: 경남대학교 평생교육원 공지사항
    org_type: university
    tier: 3
    homepage: https://www.kyungnam.ac.kr/sites/cce/index.do
    region_hint: [경남, 창원]
    verified: true
    enabled: false
    adapter:
      type: html_list
      list_url: https://www.kyungnam.ac.kr/cce/3489/subview.do?page={page}
      row_selector: table.board-table tbody tr
      title_selector: td.td-subject a
      date_selector: td.td-date
      keywords: [강사, 교강사, 강좌 개설, 개설 신청, 지도사, 지도자]
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: div.artclView }
    notes: >-
      공지사항(2026-09-22 러너 구조 검증). robots.txt 전면 차단(채용공고 항목 참조)이라 비활성. 수강생 모집이 대부분이라 keywords 로 강사 관련만.

  - id: inje_lifelong
    name: 인제대학교 평생교육원
    org_type: university
    tier: 3
    enabled: false
    homepage: https://soc.inje.ac.kr
    region_hint: [경남, 김해]
    adapter:
      type: html_list
      list_url: TODO
    notes: >-
      soc.inje.ac.kr 은 GitHub 러너에서 http/https 모두 403 Forbidden(2026-09-22, 2회). 국내 IP 또는 로컬 probe 로 재확인 필요. 대신 본교 모집/채용공지(inje_recruit)로 대체.
      2026-09-23 3회차도 동일한 403(198 bytes Apache 기본 페이지) — 러너 재실행으로는 풀리지 않는다.

  - id: kaya_lifelong
    name: 가야대학교 평생교육원
    org_type: university
    tier: 3
    enabled: false
    homepage: https://life.kaya.ac.kr
    region_hint: [경남, 김해]
    adapter:
      type: html_list
      list_url: TODO
    notes: >-
      life.kaya.ac.kr·www.kaya.ac.kr 모두 GitHub 러너에서 연결 끊김/시간초과(2026-09-22, 2회) → 지자체와 같은 러너 IP 차단으로 판단. 국내 IP 필요.
      2026-09-23 3회차도 같은 연결 끊김(RemoteDisconnected) — 러너 재실행으로는 풀리지 않는다.

  - id: gimhae_college_lifelong
    name: 김해대학교 채용/입찰
    org_type: university
    tier: 3
    enabled: true
    verified: true
    homepage: https://www.gimhae.ac.kr/www/content/219
    region_hint: [경남, 김해]
    adapter:
      type: playwright
      org_name: 김해대학교 평생직업교육원
      list_url: https://www.gimhae.ac.kr/www/board/47?page={page}
      timeout_sec: 60
      wait_for: table#ScListBoard tbody td.tit
      row_selector: table#ScListBoard tbody tr
      title_selector: td.tit a
      date_selector: td:nth-last-child(2)
      date_formats: ["%Y-%m-%d %H:%M:%S", "%Y-%m-%d"]
      id_selector: th.num, td:first-child
      link_url_template: https://www.gimhae.ac.kr/www/board/47#no{1}
      keywords: [강사, 교강사, 강의, 지도사, 초빙, 위촉, 강좌 개설]
      paging: { max_pages: 1 }
      detail: { fetch: true, click: true, url_from_page: true, body_selector: div.board-view }
    notes: >-
      평생직업교육원 전용 게시판이 없어 본교 채용/입찰 게시판을 본다(2026-09-24 러너 렌더 덤프로 구조 확인).
      제목이 href=javascript:void(0) 이고 글 번호가 DOM 에 없다. 첫 칸 순번은 상단 고정글에서 비어 있어
      화면상 순서로 보이므로 식별자로 믿을 수 없다 → 순번으로 임시 주소만 만들고 클릭해 열린
      진짜 주소로 바꾼다(url_from_page). 상단 고정글은 순번이 없어 건너뛴다.
      순번 칸은 행에 따라 th.num 이기도 하고 td 이기도 하다. td:first-child 만 잡았더니
      2026-09-24 probe 에서 목록 0건이 나왔다 — 둘 다 받게 해 둘 것.
      페이지가 무거워 기본 20초로는 목록도 못 받는다(Page.goto 타임아웃) → timeout_sec 60.
      조교 채용·입찰이 대부분이라 keywords 로 강사 관련만 거른다.
      상세 본문 셀렉터는 추정이라 첫 probe 에서 확인할 것.

  - id: changshin_lifelong
    name: 창신대학교 부설 평생교육원 알림마당
    org_type: university
    tier: 3
    enabled: true
    verified: true
    homepage: https://ice.cs.ac.kr
    region_hint: [경남, 창원]
    adapter:
      type: playwright
      org_name: 창신대학교 부설 평생교육원
      list_url: https://ice.cs.ac.kr/board/71faa983-6ed2-4ea9-868d-d2c318cae543
      wait_for: div.notice_list table tbody td.tit
      row_selector: div.notice_list table tbody tr
      title_selector: td.tit
      date_selector: td:nth-child(5)
      date_formats: ["%Y-%m-%d"]
      id_selector: td:first-child
      link_url_template: https://ice.cs.ac.kr/board/71faa983-6ed2-4ea9-868d-d2c318cae543#no{1}
      keywords: [강사, 교강사, 강의, 지도사, 초빙, 위촉, 강좌 개설]
      paging: { max_pages: 1 }
      detail: { fetch: true, click: true, url_from_page: true, body_selector: div.post-detail }
    notes: >-
      알림마당(2026-09-24 러너 렌더 덤프로 구조 확인). Nuxt SPA 라 브라우저가 필요하고,
      구형 TLS 는 크로미움이 알아서 넘긴다(평문 요청만 SECLEVEL 을 낮춰야 했다).
      목록 행에 상세 링크가 없다 — 상세 주소는 /board/{게시판UUID}/{글UUID} 인데 UUID 가 목록에 안 나온다.
      그래서 목록 단계에서는 No 칸으로 임시 주소를 만들고, 클릭해 열린 진짜 주소로 바꾼다(url_from_page).
      wait_for 는 반드시 데이터 칸(td.tit)으로 잡을 것 — tr 로 잡으면 Nuxt 가 채우기 전
      '등록된 글이 없습니다' 행을 떠 버린다.
      2026-09-24 probe: 목록 9건 정상. 상세 본문은 div.post-detail (제목·날짜·본문 628자,
      본문에서 '2026. 8. 24' 같은 마감일이 잡힌다). 추정했던 div.notice_view 는 없는 셀렉터였다.

