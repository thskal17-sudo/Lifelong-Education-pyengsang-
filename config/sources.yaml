      공지사항(2026-09-22 러너에서 gia probe 검증: '2학기 신규 교육과정(전담강사) 공개 모집' 1건 수집·본문 1373자·마감 추출 정상).
      단, robots.txt 가 'User-agent: * Disallow: /*Board.do' (Crawl-delay 10). 파이썬 robotparser 는 와일드카드를 못 읽어 통과시키지만 RFC 9309 기준으로는 차단이므로 비활성.
      운영자 동의를 받거나 정책을 정하면 enabled 로 전환.

  - id: dist_lifelong_instructor
