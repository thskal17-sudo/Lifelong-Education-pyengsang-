    notes: >-
      평생직업교육원 전용 게시판 없음. 본교 채용/입찰(www/board/47)은 JS 렌더링이라 서버 HTML 에 목록이 없음(2026-09-22) → playwright 어댑터로 재검증.

  - id: changshin_lifelong
    name: 창신대학교 부설 평생교육원
    org_type: university
    tier: 3
    enabled: false
    homepage: https://ice.cs.ac.kr
    region_hint: [경남, 창원]
    adapter:
      type: playwright
      list_url: TODO
    notes: >-
      ice.cs.ac.kr 은 구형 TLS(SECLEVEL 낮춘 컨텍스트로만 handshake 성공)이고 Vue SPA 라 서버 HTML 에 목록이 없음(2026-09-22). playwright 어댑터 + 구형 TLS 허용이 모두 필요 → gia http 클라이언트 보강 후 재검증.

