      ps.cmu.ac.kr 은 구형 TLS 라 러너 기본 설정으로는 handshake 실패, SECLEVEL 낮춘 컨텍스트로 열림(2026-09-22). adapter.tls_legacy: true 로 열 수 있게 됨(#15). 그러나 '게시판'(menu_no=20010801) 페이지는 gnb 만 있고 목록이 없음(2026-09-22 러너 덤프) — 실제 게시판 URL(iframe/별도 경로) 확인 필요. lead.cmu.ac.kr(평생직업교육대학)은 DNS 실패.

  - id: dist_lifelong
    name: 동원과학기술대학교 평생교육원 공지사항 (양산)
    org_type: university
    tier: 3
    homepage: https://center.dist.ac.kr/center/Main.do
    region_hint: [경남, 양산]
    verified: true
    enabled: false
    adapter:
      type: html_list
      list_url: https://center.dist.ac.kr/center/CMS/Board/Board.do?mCode=MN052&page={page}
      row_selector: table.board-list-table tbody tr
      title_selector: td.subject a
      date_selector: td.date
      org_selector: td.writer
      keywords: [강사, 교강사, 강좌 개설, 개설 신청, 신규, 지도사, 지도자]
      paging: { max_pages: 1 }
      detail: { fetch: true, body_selector: "div#board-wrap" }
