    notes: >-
      공지사항(2026-09-22 러너 구조 검증). robots.txt 전면 차단(채용공고 항목 참조)이라 비활성. 수강생 모집이 대부분이라 keywords 로 강사 관련만.

  - id: inje_lifelong
    name: 인제대학교 평생교육원
    org_type: university
    tier: 3
    enabled: false
    homepage: https://soc.inje.ac.kr
