# 동작 설정 (docs/DESIGN.md 13.2)
timezone: Asia/Seoul

report:
  send_time_kst: "07:30"
  weekdays_only: false
  telegram_max_items: 15
  closing_soon_days: 3
  daily_overview_llm: false     # true면 발송 시 LLM으로 3문장 총평 생성 (llm_enabled·API 키 필요)
  recheck_active_days: 3        # 활성 공고 상세 재확인 주기(마감 연장 감지)
  weekly_stats_weekday: 0       # 주간 통계를 붙이는 요일 (0=월 … 6=일, -1=끄기)

classifier:
  include_threshold: 70
  review_threshold: 30
  include_review_without_llm: true   # LLM 미사용 시 판단 유보 구간을 '판별유보' 플래그로 포함
  llm_enabled: false                 # true로 바꾸고 ANTHROPIC_API_KEY 를 등록하면 판단 유보 건부터 LLM 판별·구조화 추출
  llm_model: claude-opus-5
  llm_effort: low
  llm_max_calls_per_run: 60

collector:
  default_pages: 2
  default_days: 30            # 대학 평생교육원은 학기 단위라 공고가 드물다. 14일이면 대부분 0건
  backfill_days: 365          # 초기 적재·재수집용
  per_domain_delay_sec: 1.5
  request_timeout_sec: 20
  source_time_budget_sec: 180
  concurrency: 4
  respect_robots: true
  attachment_max_mb: 10
  attachment_max_files: 3               # 공고당 첨부 텍스트 추출 최대 파일 수
  attachment_extensions: [.hwp, .hwpx, .pdf, .docx]

interests:
  weights: {}          # 예: { lifelong: 1.5, it_digital: 1.2 }
  keywords: []         # 예: [한국어, 디지털, 성인문해]

notify:
  # github: 설정할 게 없다. 워크플로의 GITHUB_TOKEN 으로 이슈를 열면 GitHub 이
  #         저장소를 지켜보는 사람에게 메일·푸시를 보낸다. 신규나 마감임박이 있는 날만 연다.
  # email:  SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, EMAIL_FROM, EMAIL_TO 를 비밀값으로 넣어야 한다.
  # telegram: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 필요.
  #
  # 둘을 같이 쓴다. email 은 디자인을 입힌 본문을 매일 보내 파이프라인이 살아 있음을
  # 알리고(조용한 날에도 온다), github 는 신규·마감임박이 있는 날만 열어 진짜 알림이
  # 된다. 한쪽이 죽어도 다른 쪽이 남는다.
  channels: [github, email]
