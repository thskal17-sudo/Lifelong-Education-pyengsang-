name: test
on:
  push:
    paths-ignore: ["data/**", "reports/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: validate config
        run: python -c "from pathlib import Path; from gia.config import load_bundle; b=load_bundle(Path('config')); print(len(b.sources), 'sources')"
