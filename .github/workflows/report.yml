name: report
on:
  # 예약 수집이 끝나면 곧바로 보낸다. 따로 예약하면 수집과 리포트가 각각 몇 시간씩 밀린다
  # (06:05 예약이 09:45~10:01 에 돌았다, 2026-09-26~28)
  workflow_run:
    workflows: [collect]
    types: [completed]   # 수집이 일부 실패해도 보낸다 — 실패 소스는 리포트 부록에 적힌다
  schedule:
    # 예비: 수집 예약이 이날 한 번도 돌지 않았을 때. 이미 보냈으면 --once-daily 가 건너뛴다
    - cron: "59 22 * * *"   # 07:59 KST
  workflow_dispatch:
    inputs:
      send:
        description: "실제 발송 여부 (false면 파일만 생성)"
        default: "true"
      notify_test:
        description: "공고가 없어도 알림을 한 번 보내 채널 점검 (true/false)"
        default: "false"
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
  issues: write   # 알림을 이슈로 연다(gia/notify/github_issue.py)
jobs:
  report:
    # 손으로 돌린 수집(소스 하나 재수집 등) 뒤에는 보내지 않는다
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 대기 중 다른 실행이 push한 최신 커밋에서 시작 (rebase 충돌 방지)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://thskal17-sudo.github.io/Lifelong-Education-pyengsang-/
        run: |
          if [ "${{ github.event.inputs.send }}" = "false" ]; then
            python -m gia report --print
          elif [ "${{ github.event.inputs.notify_test }}" = "true" ]; then
            python -m gia report --send --notify-test
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 손으로 돌린 것은 하루 한 번 제한을 걸지 않는다. 보내라고 누른 것이다
            python -m gia report --send
          else
            # 수집 뒤 자동 실행과 예비 예약이 같은 날 겹칠 수 있다. 먼저 돈 쪽만 보낸다
            python -m gia report --send --once-daily
          fi
      - name: commit report
        if: always()
        run: |
          git config user.name "gia-bot"
          git config user.email "gia-bot@users.noreply.github.com"
          git add data reports
          git commit -m "report: $(TZ=Asia/Seoul date +%F)" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }}
          git push
