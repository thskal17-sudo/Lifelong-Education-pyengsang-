name: collect
on:
  schedule:
    # GitHub 의 예약 실행은 제시간을 보장하지 않는다. 05:10 으로 두었더니 실제로는
    # 07시대~09시대에 돌았다(2026-09-23~29 실행 기록). 밀려도 아침 전에 끝나도록 새벽으로
    # 당기고, 한 번 통째로 빠지는 날에 대비해 여러 번 잡는다. 뒤의 수집은 새 공고만 더
    # 모으고, 리포트는 --once-daily 로 하루 한 번만 나간다(report.yml)
    #
    # 경남 저장소와 몇 분 어긋나게 둔다. 같은 계정의 두 저장소가 같은 분에 몰리면
    # 둘 다 뒤로 밀린다 (경남: 01:17 · 02:47 · 04:17)
    #
    # 세 번으로 늘린 이유: GitHub 은 많이 밀린 예약을 실행하지 않고 버린다. 2026-10-06 에
    # 01:29 예약이 실행 기록조차 없이 빠졌고, 남은 04:29 하나가 07:47 에 돌아 메일이
    # 07:49 였다(그 전날은 04:45). 둘 중 하나가 빠지면 남는 것이 하나뿐이어서 여유가 없다
    # 첫 예약을 전날 밤으로 당긴다. 2026-10-13 에 지연이 6시간대로 늘어 01:29 예약이 08:05 에
    # 돌았고 메일이 08:07 — 아침 기준선을 넘겼다. 23:37 이면 같은 지연에도 06시대다
    #
    # 전날로 당겨도 메일이 두 번 가지 않는다. --once-daily 가 KST '날짜'로 세기 때문이다
    # (Store.reported_on). 23:37 수집이 제때 돌면 그 리포트는 23:40 쯤인데, 그날 아침에 이미
    # 보냈으므로 같은 날짜로 걸려 건너뛴다 — 자료만 모아 두고 다음 날 아침 메일이 그것을 쓴다.
    # 밀려서 다음 날 새벽에 돌면 그때는 새 날짜라 그 리포트가 아침 메일을 보낸다.
    # 자정에서 몇 분 거리는 피한다 — 리포트가 00시를 넘기면 날짜가 바뀌어 한밤중에 메일이 나간다
    - cron: "37 14 * * *"   # 23:37 KST (전날, 경남 23:47 과 10분 어긋나게)
    - cron: "59 17 * * *"   # 02:59 KST (예비)
    - cron: "29 19 * * *"   # 04:29 KST (예비)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "백필 일수 (0이면 기본 14일)"
        default: "0"
      sources:
        description: "쉼표로 구분한 source id (비우면 전체)"
        default: ""
      refetch:
        description: "이미 알던 URL도 상세를 다시 파싱 (파서 수정 후 보정용, true/false)"
        default: "false"
concurrency:
  group: pipeline
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 대기 중 다른 실행이 push한 최신 커밋에서 시작 (rebase 충돌 방지)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[browser]"
      - name: install browser
        run: |
          # playwright 어댑터를 쓰는 소스(신라대·부산가톨릭대 등)가 있어 크로미움이 필요하다.
          # --with-deps 는 apt 설치까지 해서 오래 걸리므로 브라우저만 받고, 실행이 안 될 때만 의존 패키지를 깐다.
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); b=p.chromium.launch(headless=True); b.close(); p.stop(); print('chromium ok')" \
            || python -m playwright install-deps chromium
      - name: collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          WORKNET_API_KEY: ${{ secrets.WORKNET_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.backfill_days }}" != "" ] && [ "${{ github.event.inputs.backfill_days }}" != "0" ]; then ARGS="$ARGS --backfill-days ${{ github.event.inputs.backfill_days }}"; fi
          if [ "${{ github.event.inputs.sources }}" != "" ]; then ARGS="$ARGS --sources ${{ github.event.inputs.sources }}"; fi
          if [ "${{ github.event.inputs.refetch }}" = "true" ]; then ARGS="$ARGS --refetch"; fi
          python -m gia collect $ARGS
      - name: commit data
        run: |
          git config user.name "gia-bot"
          git config user.email "gia-bot@users.noreply.github.com"
          git add data
          git commit -m "data: collect $(TZ=Asia/Seoul date +%F)" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }}
          git push
