name: probe
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "구조를 덤프할 목록 페이지 URL (공백/줄바꿈 구분)"
        default: ""
      sources:
        description: "gia probe 로 시험 수집할 source id (공백 구분)"
        default: ""
      body_selector:
        description: "dump 시 이 CSS 셀렉터의 본문 전문을 출력 (예: div#bo_v_con)"
        default: ""
      days:
        description: "probe 수집 기간(일). 비우면 settings.yaml 의 default_days. 게시가 뜸한 게시판 셀렉터 확인용으로 90 등"
        default: ""
      render:
        description: "브라우저(playwright)로 렌더링해서 덤프·수집 (JS 게시판용, true/false)"
        default: "false"
      wait_for:
        description: "렌더 덤프에서 이 셀렉터가 나타날 때까지 대기 (예: table tbody tr)"
        default: ""
      click:
        description: "렌더 덤프에서 클릭할 셀렉터 (탭 전환, 또는 목록의 첫 글 제목을 눌러 상세 열기)"
        default: ""
      wait_after:
        description: "클릭 뒤 이 셀렉터가 나타날 때까지 대기 (비우면 networkidle)"
        default: ""
      detail:
        description: "덤프를 상세 페이지로 분석 (본문·첨부 후보 출력). 클릭으로 연 상세는 URL 이 안 바뀌므로 필요 (true/false)"
        default: "false"
      render_timeout:
        description: "렌더 덤프 대기 시간(초). 느린 사이트는 60 등. 기본 25"
        default: ""
      ignore_keywords:
        description: "probe 에서 keywords 필터를 무시하고 목록 전부 표시 (셀렉터 확인용, true/false)"
        default: "false"
      brief:
        description: "덤프 출력을 줄여 여러 사이트를 한 번에 훑기 (true/false)"
        default: "false"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . requests beautifulsoup4 lxml
      - name: install browser
        if: ${{ github.event.inputs.render == 'true' }}
        run: |
          pip install -e ".[browser]"
          # --with-deps 는 apt 설치까지 해서 10분 넘게 걸린다. 러너 이미지에 필요한 라이브러리가
          # 대부분 이미 있으므로 브라우저만 받고, 실행이 안 될 때만 의존 패키지를 깐다.
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); b=p.chromium.launch(headless=True); b.close(); p.stop(); print('chromium ok')" \
            || python -m playwright install-deps chromium
      - name: dump structure
        if: ${{ github.event.inputs.urls != '' && github.event.inputs.render != 'true' }}
        env:
          URLS: ${{ github.event.inputs.urls }}
          BODY_SELECTOR: ${{ github.event.inputs.body_selector }}
          BRIEF: ${{ github.event.inputs.brief == 'true' && '1' || '' }}
        run: python scripts/dump_structure.py
      - name: dump structure (rendered)
        if: ${{ github.event.inputs.urls != '' && github.event.inputs.render == 'true' }}
        env:
          URLS: ${{ github.event.inputs.urls }}
          BODY_SELECTOR: ${{ github.event.inputs.body_selector }}
          WAIT_FOR: ${{ github.event.inputs.wait_for }}
          CLICK: ${{ github.event.inputs.click }}
          WAIT_AFTER: ${{ github.event.inputs.wait_after }}
          DETAIL: ${{ github.event.inputs.detail == 'true' && '1' || '' }}
          RENDER_TIMEOUT_SEC: ${{ github.event.inputs.render_timeout }}
          BRIEF: ${{ github.event.inputs.brief == 'true' && '1' || '' }}
        run: python scripts/dump_rendered.py
      - name: gia probe
        if: ${{ github.event.inputs.sources != '' }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          WORKNET_API_KEY: ${{ secrets.WORKNET_API_KEY }}
          SOURCES: ${{ github.event.inputs.sources }}
          DAYS: ${{ github.event.inputs.days }}
          IGNORE_KEYWORDS: ${{ github.event.inputs.ignore_keywords }}
        run: |
          if [ -n "$DAYS" ]; then
            sed -i "s/^\(\s*default_days:\s*\).*/\1$DAYS/" config/settings.yaml
            grep -n "default_days" config/settings.yaml
          fi
          for s in $SOURCES; do
            echo "::group::probe $s"
            if [ "$IGNORE_KEYWORDS" = "true" ]; then
              python -m gia probe "$s" --detail --ignore-keywords || true
            else
              python -m gia probe "$s" --detail || true
            fi
            echo "::endgroup::"
          done
