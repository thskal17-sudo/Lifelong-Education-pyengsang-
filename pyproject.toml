[project]
name = "gia"
version = "0.1.0"
description = "부산·울산·경남 대학 평생교육원 강사 공고 수집·일일 요약 (Lifelong Education)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  # lexbor 백엔드를 쓴다(gia/collectors/html_list.py). 0.3.12 부터 있다.
  # 주 버전은 묶어 둔다 — 1.0 이 옛 백엔드를 말없이 지우면서 수집·보고가 멈춘 적이 있다(2026-10-04)
  "selectolax>=0.3.12,<2",
  "rapidfuzz>=3.0",
  "pypdf>=4.0",
  "olefile>=0.46",
  "anthropic>=1.0",
  "openpyxl>=3.1",   # 일일 요약에 붙이는 엑셀 첨부 (gia/report/excel.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.4"]
browser = ["playwright>=1.45"]

[project.scripts]
gia = "gia.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gia*"]

[tool.setuptools.package-data]
gia = ["report/templates/*.j2", "report/assets/*.xlsx"]   # 강사잇다 업로드 양식

[tool.pytest.ini_options]
testpaths = ["tests"]
