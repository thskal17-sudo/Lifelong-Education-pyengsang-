[project]
name = "gia"
version = "0.1.0"
description = "부산·울산·경남 대학 평생교육원 강사 공고 수집·일일 요약 (Lifelong Education)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  # 1.0 에서 Modest 백엔드가 빠졌다. gia/collectors/html_list.py 가 쓰는
  # selectolax.parser.HTMLParser 가 그것이라, 1.0 이 깔리면 import 에서 죽는다
  # (2026-10-04 러너에서 두 저장소 수집·보고가 모두 멈췄다). lexbor 로 옮기기 전까지 묶는다
  "selectolax>=0.3,<1.0",
  "rapidfuzz>=3.0",
  "pypdf>=4.0",
  "olefile>=0.46",
  "anthropic>=1.0",
  "openpyxl>=3.1",   # 일일 요약에 붙이는 엑셀 첨부 (gia/report/excel.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.4"]
browser = ["playwright>=1.45"]

[project.scripts]
gia = "gia.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gia*"]

[tool.setuptools.package-data]
gia = ["report/templates/*.j2", "report/assets/*.xlsx"]   # 강사잇다 업로드 양식

[tool.pytest.ini_options]
testpaths = ["tests"]
